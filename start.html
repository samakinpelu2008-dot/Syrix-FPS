<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<title>Syrix Arena - Match</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:'Rajdhani',Arial,sans-serif;
}

#gameCanvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

:root{
    --cyan:#22d6ff;
    --cyan-soft:rgba(34,214,255,.55);
    --panel:rgba(6,14,24,.6);
    --ink:#eaf7ff;
    --dim:#8fa9b8;
    --gold-1:#ffe27a;
    --gold-2:#ffc534;
    --gold-3:#e2860a;
    --red:#ff3b3b;
}

.hud{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    z-index:10;
    pointer-events:none;
}

/* ============ CROSSHAIR ============ */

.crosshair{
    position:absolute;
    top:50%;
    left:50%;
    width:1.6vw;
    height:1.6vw;
    min-width:18px;
    min-height:18px;
    transform:translate(-50%,-50%);
}

.crosshair::before,
.crosshair::after{
    content:"";
    position:absolute;
    background:var(--cyan);
    box-shadow:0 0 6px rgba(34,214,255,.8);
}

.crosshair::before{
    left:50%;
    top:0;
    bottom:0;
    width:2px;
    transform:translateX(-50%);
}

.crosshair::after{
    top:50%;
    left:0;
    right:0;
    height:2px;
    transform:translateY(-50%);
}

/* ============ HIT MARKER ============ */

.hit-marker{
    position:absolute;
    top:50%;
    left:50%;
    width:2.6vw;
    height:2.6vw;
    min-width:30px;
    min-height:30px;
    transform:translate(-50%,-50%) scale(.6);
    opacity:0;
    transition:opacity .1s ease,transform .1s ease;
}

.hit-marker.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

.hit-marker::before,
.hit-marker::after{
    content:"";
    position:absolute;
    width:100%;
    height:2px;
    background:#fff;
    top:50%;
    left:0;
}

.hit-marker::before{transform:translateY(-50%) rotate(45deg);}
.hit-marker::after{transform:translateY(-50%) rotate(-45deg);}

/* ============ HEALTH ============ */

.health-wrap{
    position:absolute;
    left:1.4vw;
    bottom:1.4vw;
    width:24vw;
    max-width:300px;
}

.health-label{
    color:var(--ink);
    font-weight:700;
    font-size:.85vw;
    letter-spacing:.06em;
    margin-bottom:.3vw;
    text-shadow:0 0 6px rgba(0,0,0,.8);
}

.health-track{
    height:1.4vw;
    max-height:18px;
    border-radius:1vw;
    background:rgba(0,0,0,.5);
    border:1px solid var(--cyan-soft);
    overflow:hidden;
}

.health-fill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#ff5b5b,#ff3b3b);
    transition:width .2s ease;
}

/* ============ AMMO ============ */

.ammo-wrap{
    position:absolute;
    right:1.4vw;
    bottom:9vw;
    text-align:right;
}

.ammo-text{
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:2vw;
    color:var(--ink);
    text-shadow:0 0 10px rgba(34,214,255,.6);
}

.reload-label{
    color:var(--gold-2);
    font-weight:700;
    font-size:.95vw;
    letter-spacing:.1em;
    opacity:0;
    transition:opacity .2s ease;
}

/* ============ MINIMAP ============ */

.minimap{
    position:absolute;
    top:1.4vw;
    left:1.4vw;
    width:11vw;
    height:11vw;
    max-width:140px;
    max-height:140px;
    border-radius:1vw;
    background:var(--panel);
    border:1px solid var(--cyan-soft);
    overflow:hidden;
}

.minimap-dot{
    position:absolute;
    top:50%;
    left:50%;
    width:.6vw;
    height:.6vw;
    min-width:8px;
    min-height:8px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 6px var(--cyan);
    transform:translate(-50%,-50%);
}

/* ============ KILL FEED ============ */

.kill-feed{
    position:absolute;
    top:1.4vw;
    right:1.4vw;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:.4vw;
    max-width:60vw;
}

.kill-feed-row{
    background:var(--panel);
    border:1px solid rgba(34,214,255,.25);
    color:var(--ink);
    font-size:.85vw;
    font-weight:600;
    padding:.3vw .8vw;
    border-radius:.5vw;
}

/* ============ JOYSTICK ============ */

.joystick-base{
    position:absolute;
    left:6vw;
    bottom:6vw;
    width:11vw;
    height:11vw;
    max-width:140px;
    max-height:140px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
    border:1px solid var(--cyan-soft);
    pointer-events:auto;
}

.joystick-knob{
    position:absolute;
    top:50%;
    left:50%;
    width:5vw;
    height:5vw;
    max-width:64px;
    max-height:64px;
    margin-left:-2.5vw;
    margin-top:-2.5vw;
    border-radius:50%;
    background:rgba(34,214,255,.35);
    border:1px solid var(--cyan);
}

/* ============ FIRE / JUMP / CROUCH ============ */

.fire-btn{
    position:absolute;
    right:6vw;
    bottom:6vw;
    width:9vw;
    height:9vw;
    max-width:104px;
    max-height:104px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,80,80,.35),rgba(255,30,30,.15));
    border:2px solid rgba(255,90,90,.7);
    pointer-events:auto;
}

.side-btn{
    position:absolute;
    width:5.4vw;
    height:5.4vw;
    max-width:64px;
    max-height:64px;
    border-radius:50%;
    background:var(--panel);
    border:1px solid var(--cyan-soft);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.8vw;
    font-weight:700;
    pointer-events:auto;
}

.side-btn.active{
    background:rgba(34,214,255,.3);
    border-color:var(--cyan);
}

#jumpBtn{right:17vw;bottom:11vw;}
#crouchBtn{right:17vw;bottom:4vw;}

/* ============ LOADING SCREEN ============ */

.loading-screen{
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:#02060a;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:opacity .4s ease;
}

.loading-title{
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:2vw;
    color:var(--cyan);
    letter-spacing:.1em;
    text-shadow:0 0 16px rgba(34,214,255,.6);
    margin-bottom:2vw;
}

.loading-track{
    width:40vw;
    max-width:420px;
    height:.8vw;
    max-height:10px;
    border-radius:1vw;
    background:rgba(255,255,255,.1);
    overflow:hidden;
}

.loading-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--gold-1),var(--gold-2));
    transition:width .2s ease;
}

</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div class="hud">

    <div class="crosshair"></div>
    <div class="hit-marker" id="hitMarker"></div>

    <div class="health-wrap">
        <div class="health-label">HEALTH</div>
        <div class="health-track"><div class="health-fill" id="healthFill"></div></div>
    </div>

    <div class="ammo-wrap">
        <div class="ammo-text" id="ammoText">30 / 30</div>
        <div class="reload-label" id="reloadLabel">RELOADING</div>
    </div>

    <div class="minimap" id="minimap">
        <div class="minimap-dot" id="minimapDot"></div>
    </div>

    <div class="kill-feed" id="killFeed">
        <div class="kill-feed-row" id="killFeedList"></div>
    </div>

    <div class="joystick-base" id="joystickBase">
        <div class="joystick-knob" id="joystickKnob"></div>
    </div>

    <button class="fire-btn" id="fireBtn"></button>
    <button class="side-btn" id="jumpBtn">JUMP</button>
    <button class="side-btn" id="crouchBtn">CROUCH</button>

</div>

<div class="loading-screen" id="loadingScreen">
    <div class="loading-title">ENTERING ARENA</div>
    <div class="loading-track"><div class="loading-fill" id="loadingFill"></div></div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>

<script src="characters.js"></script>
<script src="guns.js"></script>
<script src="maps.js"></script>
<script src="loader.js"></script>
<script src="world.js"></script>
<script src="player.js"></script>
<script src="weapon.js"></script>
<script src="hud.js"></script>
<script src="audio.js"></script>

<script>

/* ---- scene / camera / renderer ---- */

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 500);

var playerRig = new THREE.Object3D();
playerRig.add(camera);
scene.add(playerRig);

var renderer = new THREE.WebGLRenderer({
    antialias: true,
    canvas: document.getElementById('gameCanvas')
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.autoClear = false;

var hemiLight = new THREE.HemisphereLight(0xbfe9ff, 0x0a1018, 1.1);
scene.add(hemiLight);

var sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
sunLight.position.set(20, 30, 10);
scene.add(sunLight);

window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('touchstart', function(){
    AudioSystem.unlock();
}, { once: true });

/* ---- which match/map are we in ---- */

var urlParams = new URLSearchParams(window.location.search);
var selectedMode = urlParams.get('mode') || sessionStorage.getItem('selectedMode') || 'BA RANKED';
var mapId = getMapForMode(selectedMode);

var loadingScreen = document.getElementById('loadingScreen');
var loadingFill = document.getElementById('loadingFill');

AssetLoader.setProgressHandler(function(path, ratio){
    if(loadingFill){
        loadingFill.style.width = (ratio * 100) + '%';
    }
});

/* ---- modules ---- */

PlayerController.init();
WeaponSystem.init(camera);
HUD.init();
HUD.setHealth(100, 100);

var groundY = 1.6;
var velocityY = 0;
var isGrounded = true;
var GRAVITY = 16;
var JUMP_SPEED = 6.2;

GameWorld.load(mapId, scene).then(function(mapData){
    var spawn = mapData.spawnPoints[0];
    playerRig.position.set(spawn.x, spawn.y, spawn.z);
    groundY = spawn.y;
    hideLoadingScreen();
    lastTime = performance.now();
    requestAnimationFrame(animate);
}).catch(function(){
    hideLoadingScreen();
    lastTime = performance.now();
    requestAnimationFrame(animate);
});

function hideLoadingScreen(){
    if(!loadingScreen)return;
    loadingScreen.style.opacity = '0';
    setTimeout(function(){
        loadingScreen.style.display = 'none';
    }, 400);
}

/* ---- main loop ---- */

var yaw = 0;
var pitch = 0;
var lastTime = performance.now();

var FORWARD = new THREE.Vector3();
var RIGHT = new THREE.Vector3();
var UP_AXIS = new THREE.Vector3(0, 1, 0);

function animate(){
    requestAnimationFrame(animate);

    var now = performance.now();
    var dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    /* look */
    var look = PlayerController.consumeLookDelta();
    yaw -= look.x;
    pitch -= look.y;
    pitch = Math.max(-1.3, Math.min(1.3, pitch));

    playerRig.rotation.y = yaw;
    camera.rotation.x = pitch;

    /* move */
    var move = PlayerController.getMoveVector();
    var isMoving = Math.abs(move.x) > 0.05 || Math.abs(move.z) > 0.05;
    var crouching = PlayerController.getIsCrouching();
    var speed = (crouching ? 2.2 : 4.2) * dt;

    if(isMoving){
        FORWARD.set(0, 0, -1).applyAxisAngle(UP_AXIS, yaw);
        RIGHT.set(1, 0, 0).applyAxisAngle(UP_AXIS, yaw);

        var moveX = (FORWARD.x * -move.z + RIGHT.x * move.x) * speed;
        var moveZ = (FORWARD.z * -move.z + RIGHT.z * move.x) * speed;

        tryMove(moveX, moveZ);
    }

    /* jump / gravity - flat-ground approximation for v1, swap groundY
       for a real raycast-against-map-height once real maps exist */
    if(PlayerController.consumeJumpRequest() && isGrounded){
        velocityY = JUMP_SPEED;
        isGrounded = false;
    }

    velocityY -= GRAVITY * dt;
    playerRig.position.y += velocityY * dt;

    var standHeight = crouching ? groundY - 0.4 : groundY;
    if(playerRig.position.y <= standHeight){
        playerRig.position.y = standHeight;
        velocityY = 0;
        isGrounded = true;
    }

    /* weapon */
    WeaponSystem.applySway(look.x, look.y);
    WeaponSystem.update(dt, isMoving);

    /* render: world layer, then clear depth, then viewmodel layer
       on top - this is what stops the gun clipping into walls */
    renderer.clear(true, true, true);
    camera.layers.disable(1);
    renderer.render(scene, camera);

    renderer.clearDepth();
    camera.layers.enable(1);
    camera.layers.disable(0);
    renderer.render(scene, camera);
    camera.layers.enable(0);
}

function tryMove(dx, dz){
    var nextX = playerRig.position.x + dx;
    var nextZ = playerRig.position.z + dz;

    var playerBox = new THREE.Box3().setFromCenterAndSize(
        new THREE.Vector3(nextX, playerRig.position.y, nextZ),
        new THREE.Vector3(0.6, 1.8, 0.6)
    );

    var colliders = GameWorld.getColliders();
    for(var i = 0; i < colliders.length; i++){
        if(playerBox.intersectsBox(colliders[i])){
            return;
        }
    }

    playerRig.position.x = nextX;
    playerRig.position.z = nextZ;
}

</script>

</body>
</html>
