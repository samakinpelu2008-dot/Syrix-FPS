<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Syrix Arena</title>

<link rel="manifest" href="manifest.json">

<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:black;
}

.bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:relative;
    width:100%;
    height:100%;
}

.glass{
    background:rgba(15,20,35,0.45);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:
        0 0 25px rgba(0,255,255,.25);
}

/* PLAYER */

.player{
    position:absolute;
    top:15px;
    left:15px;
    width:280px;
    height:75px;
    border-radius:20px;
    display:flex;
    align-items:center;
    padding:15px;
    gap:15px;
    color:white;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:12px;
    background:rgba(255,255,255,.1);
    display:flex;
    align-items:center;
    justify-content:center;
}

.avatar svg{
    width:30px;
    height:30px;
}

.player h2{
    font-size:28px;
}

.player span{
    color:#ffc94a;
}

.xp{
    width:150px;
    height:5px;
    background:#333;
    border-radius:20px;
    margin-top:5px;
}

.fill{
    width:75%;
    height:100%;
    border-radius:20px;
    background:#00e5ff;
}

/* CURRENCY */

.currency{
    position:absolute;
    right:15px;
    top:15px;
    padding:15px 20px;
    border-radius:20px;
    display:flex;
    gap:20px;
}

.item{
    display:flex;
    align-items:center;
    gap:8px;
    color:white;
}

.item img{
    width:32px;
}

/* CHARACTER */

.character{
    position:absolute;
    left:50%;
    top:48%;
    transform:translate(-50%,-50%);
    width:280px;
    height:430px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.character canvas{
    width:100%;
    height:100%;
}

.robot-placeholder{
    color:white;
    font-size:22px;
    text-align:center;
}

.pedestal{
    position:absolute;
    bottom:20px;
    width:250px;
    height:25px;
    border-radius:50%;
    box-shadow:
        0 0 30px cyan,
        0 0 60px cyan;
}

/* STATS */

.circle{
    position:absolute;
    width:140px;
    height:140px;
    border-radius:50%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
}

.kd{
    left:40px;
    top:220px;
}

.acc{
    right:40px;
    top:220px;
}

.circle h1{
    color:#00e5ff;
    font-size:42px;
}

/* MAP */

.map{
    position:absolute;
    left:40px;
    bottom:190px;
    width:140px;
    height:90px;
    border-radius:15px;
}

/* WEAPON STATS */

.weapon{
    position:absolute;
    right:40px;
    bottom:190px;
    width:150px;
    height:90px;
    border-radius:15px;
}

/* MODES */

.modes{
    position:absolute;
    width:100%;
    bottom:110px;
    display:flex;
    justify-content:center;
    gap:20px;
}

.mode{
    width:220px;
    height:85px;
    border:none;
    border-radius:22px;
    color:#00e5ff;
    font-size:34px;
    cursor:pointer;
}

.mode small{
    display:block;
    color:white;
    font-size:14px;
}

/* BOTTOM NAV */

.bottom{
    position:absolute;
    left:15px;
    right:15px;
    bottom:15px;
    height:80px;
    border-radius:25px;
    display:flex;
}

.bottom button{
    flex:1;
    border:none;
    background:none;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
}

.bottom img{
    width:38px;
    height:38px;
}

.bottom svg{
    width:35px;
    height:35px;
}

/* MOBILE */

@media(max-width:700px){

    .player{
        width:220px;
    }

    .player h2{
        font-size:20px;
    }

    .currency{
        gap:10px;
    }

    .item img{
        width:26px;
    }

    .circle{
        width:110px;
        height:110px;
    }

    .mode{
        width:160px;
        font-size:26px;
    }

}

</style>
</head>

<body>

<img src="./images/bg.png" class="bg">

<div class="overlay">

    <!-- PLAYER -->

    <div class="player glass">

        <div class="avatar">
            <i data-lucide="user"></i>
        </div>

        <div>
            <small>COMMANDER</small>
            <h2>PlayerOne <span>// LV 24</span></h2>

            <div class="xp">
                <div class="fill"></div>
            </div>
        </div>

    </div>

    <!-- CURRENCY -->

    <div class="currency glass">

        <div class="item">
            <img src="./images/coin.png">
            <span>1200</span>
        </div>

        <div class="item">
            <img src="./images/gem.png">
            <span>45</span>
        </div>

        <div class="item">
            <img src="./images/token.png">
            <span>10</span>
        </div>

    </div>

    <!-- CHARACTER -->

    <div class="character">

        <div class="robot-placeholder">
            3D CHARACTER
        </div>

        <div class="pedestal"></div>

    </div>

    <!-- KD -->

    <div class="circle kd glass">
        <small>K/D RATIO</small>
        <h1>1.85</h1>
    </div>

    <!-- ACCURACY -->

    <div class="circle acc glass">
        <small>ACCURACY</small>
        <h1>68%</h1>
    </div>

    <!-- MAP -->

    <div class="map glass"></div>

    <!-- WEAPON -->

    <div class="weapon glass"></div>

    <!-- MODES -->

    <div class="modes">

        <button class="mode glass">
            ▶ 1v1
            <small>COMPETITIVE</small>
        </button>

        <button class="mode glass">
            ▶ LV MODE
            <small>LEVELS</small>
        </button>

    </div>

    <!-- BOTTOM NAV -->

    <div class="bottom glass">

        <button>
            <i data-lucide="shopping-cart"></i>
            <span>STORE</span>
        </button>

        <button>
            <img src="./images/weapons.png">
            <span>WEAPONS</span>
        </button>

        <button>
            <img src="./images/characters.png">
            <span>CHARACTERS</span>
        </button>

        <button>
            <i data-lucide="settings"></i>
            <span>SETTINGS</span>
        </button>

    </div>

</div>

<script>

lucide.createIcons();

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
}

</script>

</body>
</html>
