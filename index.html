<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Syrix Arena</title>

<link rel="manifest" href="./manifest.json">

<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    width:100vw;
    height:100dvh;
    overflow:hidden;
    color:white;
    background:#000;
}

.lobby{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;

    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
}

.bg{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    z-index:-1;
}

.glass{
    background:rgba(15,20,35,.55);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.1);
}

/* PLAYER */

.player{
    position:absolute;
    top:15px;
    left:15px;

    width:220px;

    padding:12px;

    border-radius:20px;

    display:flex;
    gap:12px;
}

.avatar{
    width:45px;
    height:45px;

    border-radius:12px;

    background:rgba(255,255,255,.1);

    display:flex;
    align-items:center;
    justify-content:center;
}

.player h3{
    font-size:20px;
}

.player small{
    opacity:.8;
}

.xp{
    width:120px;
    height:5px;

    background:#333;

    border-radius:20px;

    margin-top:5px;
}

.fill{
    width:75%;
    height:100%;

    border-radius:20px;

    background:#00e5ff;
}

/* CURRENCY */

.currency{
    position:absolute;

    top:15px;
    right:15px;

    padding:10px 15px;

    border-radius:20px;

    display:flex;

    gap:15px;
}

.currency div{
    display:flex;
    align-items:center;
    gap:5px;
}

.currency img{
    width:24px;
}

/* LEFT MENU */

.left-menu{
    position:absolute;

    left:15px;

    top:38%;

    display:flex;

    flex-direction:column;

    gap:10px;
}

.left-menu button{
    width:110px;
    height:42px;

    border:none;

    color:white;

    border-radius:14px;

    background:rgba(20,30,45,.65);
}

/* RIGHT */

.right-menu{
    position:absolute;

    right:15px;

    top:38%;

    display:flex;

    flex-direction:column;

    gap:10px;
}

.right-menu button{
    width:45px;
    height:45px;

    border:none;

    border-radius:50%;

    color:white;

    background:rgba(20,30,45,.65);
}

/* CHARACTER */

.character{
    position:absolute;

    left:50%;
    top:46%;

    transform:translate(-50%,-50%);

    width:180px;
    height:260px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:28px;

    text-shadow:0 0 20px cyan;
}

/* MODE */

.mode-box{
    position:absolute;

    right:20px;

    bottom:115px;

    width:180px;

    padding:12px;

    border-radius:18px;
}

.mode-box select{
    width:100%;

    background:none;

    border:none;

    color:white;

    font-size:18px;

    outline:none;
}

/* START */

.start-btn{
    position:absolute;

    right:20px;

    bottom:25px;

    width:180px;

    height:65px;

    border:none;

    border-radius:18px;

    font-size:26px;

    font-weight:bold;

    color:black;

    background:linear-gradient(
        90deg,
        #ffb800,
        #ffe94d
    );

    box-shadow:0 0 30px orange;
}

/* BOTTOM */

.bottom{
    position:absolute;

    left:50%;

    transform:translateX(-50%);

    bottom:15px;

    width:260px;

    height:70px;

    border-radius:22px;

    display:flex;

    justify-content:space-around;

    align-items:center;
}

.bottom button{
    background:none;
    border:none;
    color:white;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:4px;
}

.bottom img{
    width:30px;
    height:30px;
}

.bottom svg{
    width:24px;
    height:24px;
}

/* MOBILE */

@media(max-width:700px){

    .player{
        transform:scale(.9);
        transform-origin:left top;
    }

    .currency{
        transform:scale(.9);
        transform-origin:right top;
    }

    .left-menu{
        top:42%;
    }

    .right-menu{
        top:42%;
    }

    .character{
        top:45%;
        width:150px;
        height:220px;
        font-size:22px;
    }

    .mode-box{
        width:150px;
        bottom:100px;
    }

    .start-btn{
        width:160px;
        height:58px;
        font-size:22px;
    }

    .bottom{
        width:230px;
        height:65px;
    }
}

</style>
</head>

<body>

<div class="lobby">

<img src="./images/bg.png" class="bg">

<!-- PLAYER -->

<div class="player glass">

<div class="avatar">
<i data-lucide="user"></i>
</div>

<div>
<small>COMMANDER</small>
<h3>PlayerOne</h3>

<div class="xp">
<div class="fill"></div>
</div>

</div>
</div>

<!-- CURRENCY -->

<div class="currency glass">

<div>
<img src="./images/coin.png">
1200
</div>

<div>
<img src="./images/gem.png">
45
</div>

<div>
<img src="./images/token.png">
10
</div>

</div>

<!-- LEFT -->

<div class="left-menu">

<button class="glass">
STORE
</button>

<button class="glass">
MISSIONS
</button>

<button class="glass">
EVENTS
</button>

</div>

<!-- RIGHT -->

<div class="right-menu">

<button class="glass">
<i data-lucide="users"></i>
</button>

<button class="glass">
<i data-lucide="mail"></i>
</button>

<button class="glass">
<i data-lucide="trophy"></i>
</button>

</div>

<!-- CHARACTER -->

<div class="character">
SYRIX<br>SOLDIER
</div>

<!-- MODE -->

<div class="mode-box glass">

<select>

<option>1v1</option>

<option>Team</option>

<option>LV Mode</option>

<option>Team Death Match</option>

<option>CS Ranked</option>

</select>

</div>

<!-- START -->

<button class="start-btn">
START ▶
</button>

<!-- BOTTOM -->

<div class="bottom glass">

<button>
<img src="./images/weapons.png">
<small>WEAPONS</small>
</button>

<button>
<img src="./images/characters.png">
<small>CHARACTERS</small>
</button>

<button>
<i data-lucide="settings"></i>
<small>SETTINGS</small>
</button>

</div>

</div>

<script>

lucide.createIcons();

if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js");
}

</script>

</body>
</html>
