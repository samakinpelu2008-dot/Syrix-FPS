<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover">

<title>Syrix Arena</title>

<link rel="manifest" href="manifest.json">

<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#000;
}

body{
    background:url("images/bg.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.overlay{
    position:fixed;
    inset:0;
}

/* TOP BAR */

.profile{
    position:absolute;
    top:20px;
    left:20px;
    width:180px;
    height:65px;
    background:rgba(0,0,0,.55);
    border:1px solid #23d7ff;
    border-radius:20px;
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    padding:10px;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#222;
    margin-right:10px;
}

.player-name{
    color:white;
    font-size:18px;
    font-weight:bold;
}

.top-icons{
    position:absolute;
    top:25px;
    left:230px;
    display:flex;
    gap:15px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:12px;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #23d7ff;
    color:white;
}

.logo{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    color:#33e7ff;
    font-size:32px;
    font-weight:900;
    text-shadow:0 0 20px cyan;
}

.currency{
    position:absolute;
    top:20px;
    right:20px;
    display:flex;
    gap:15px;
    background:rgba(0,0,0,.55);
    border-radius:20px;
    padding:12px;
    border:1px solid #23d7ff;
}

.money{
    display:flex;
    align-items:center;
    gap:6px;
    color:white;
    font-weight:bold;
}

.money img{
    width:28px;
}

/* LEFT MENU */

.left-menu{
    position:absolute;
    top:180px;
    left:20px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu-btn{
    width:160px;
    height:50px;
    border-radius:15px;
    background:rgba(0,0,0,.6);
    border:1px solid cyan;
    color:white;
    display:flex;
    align-items:center;
    gap:10px;
    padding-left:20px;
}

/* FRIENDS */

.friends{
    position:absolute;
    right:20px;
    top:140px;
    width:180px;
    height:220px;
    background:rgba(0,0,0,.6);
    border-radius:20px;
    border:1px solid cyan;
    padding:15px;
    color:white;
}

.friend{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

/* MODE */

.mode{
    position:absolute;
    right:20px;
    bottom:140px;
    width:180px;
    height:50px;
    border-radius:15px;
    background:rgba(0,0,0,.7);
    border:1px solid cyan;
    color:white;
    padding:10px;
}

/* START */

.start{
    position:absolute;
    right:20px;
    bottom:70px;
    width:180px;
    height:60px;
    border:none;
    border-radius:15px;
    background:#00d9ff;
    color:black;
    font-size:26px;
    font-weight:bold;
}

/* BOTTOM */

.bottom-bar{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:340px;
    height:60px;
    background:rgba(0,0,0,.7);
    border:1px solid cyan;
    border-radius:20px;
    display:flex;
}

.bottom-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    gap:10px;
}

.bottom-btn img{
    width:30px;
}

/* CHAT */

.chat{
    position:absolute;
    left:20px;
    bottom:20px;
    width:170px;
    height:45px;
    border-radius:15px;
    background:rgba(0,0,0,.7);
    border:1px solid cyan;
    display:flex;
    align-items:center;
    padding-left:15px;
    color:white;
}

/* MOBILE */

@media(max-width:800px){

.logo{
    font-size:22px;
}

.profile{
    width:150px;
}

.currency{
    transform:scale(.85);
    transform-origin:right top;
}

.left-menu{
    top:140px;
}

.menu-btn{
    width:120px;
    height:42px;
    font-size:13px;
}

.friends{
    width:140px;
}

.mode{
    width:140px;
}

.start{
    width:140px;
}

.bottom-bar{
    width:280px;
}

}

</style>
</head>

<body>

<div class="overlay">

<div class="profile">
<div class="avatar"></div>
<div>
<div style="color:#aaa;font-size:12px;">COMMANDER</div>
<div class="player-name">PlayerOne</div>
</div>
</div>

<div class="top-icons">
<div class="icon-btn">
<i data-lucide="bell"></i>
</div>

<div class="icon-btn">
<i data-lucide="settings"></i>
</div>
</div>

<div class="logo">
SYRIX ARENA
</div>

<div class="currency">

<div class="money">
<img src="images/coin.png">
1200
</div>

<div class="money">
<img src="images/gem.png">
45
</div>

<div class="money">
<img src="images/token.png">
10
</div>

</div>

<div class="left-menu">

<div class="menu-btn">
<i data-lucide="shopping-cart"></i>
STORE
</div>

<div class="menu-btn">
<i data-lucide="sparkles"></i>
LUCKY ARENA
</div>

<div class="menu-btn">
<i data-lucide="calendar"></i>
EVENTS
</div>

</div>

<div class="friends">

<b>FRIENDS</b>

<div class="friend">
Player 1
<i data-lucide="plus"></i>
</div>

<div class="friend">
Player 2
<i data-lucide="plus"></i>
</div>

<div class="friend">
Player 3
<i data-lucide="plus"></i>
</div>

</div>

<select class="mode">
<option>CS Ranked</option>
<option>1v1</option>
<option>Team</option>
<option>LV Mode</option>
<option>TDM</option>
</select>

<button class="start">
▶ START
</button>

<div class="chat">
WORLD CHAT
</div>

<div class="bottom-bar">

<div class="bottom-btn">
<img src="images/weapons.png">
Weapons
</div>

<div class="bottom-btn">
<img src="images/characters.png">
Characters
</div>

<div class="bottom-btn">
<i data-lucide="trophy"></i>
Leaderboard
</div>

</div>

</div>

<script>
lucide.createIcons();

if('serviceWorker' in navigator){
navigator.serviceWorker.register('./sw.js');
}
</script>

</body>
    </html>
