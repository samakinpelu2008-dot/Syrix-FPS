<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Syrix Arena</title>

<link rel="manifest" href="manifest.json">

<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    width:100vw;
    height:100vh;
    background:#000;
}

.bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:-1;
}

.glass{
    background:rgba(15,20,35,.45);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 0 20px rgba(0,255,255,.2);
}

/* PLAYER */

.player{
    position:absolute;
    top:20px;
    left:20px;
    width:280px;
    border-radius:20px;
    padding:15px;
    display:flex;
    gap:15px;
    color:white;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:12px;
    background:rgba(255,255,255,.1);
    display:flex;
    justify-content:center;
    align-items:center;
}

.player h2{
    font-size:28px;
}

.player span{
    color:#ffc84a;
}

.xp{
    width:150px;
    height:5px;
    background:#333;
    border-radius:20px;
    margin-top:5px;
}

.fill{
    width:75%;
    height:100%;
    background:#00e5ff;
    border-radius:20px;
}

/* CURRENCY */

.currency{
    position:absolute;
    top:20px;
    right:20px;
    border-radius:20px;
    padding:15px 20px;
    display:flex;
    gap:20px;
}

.item{
    display:flex;
    align-items:center;
    gap:8px;
    color:white;
}

.item img{
    width:30px;
}

/* CHARACTER */

.character{
    position:absolute;
    left:50%;
    top:43%;
    transform:translate(-50%,-50%);
    width:220px;
    height:300px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    text-align:center;
    font-size:30px;
    text-shadow:0 0 20px cyan;
}

/* CIRCLES */

.circle{
    position:absolute;

    width:120px;
    height:120px;

    border-radius:50%;

    background:rgba(20,30,40,.35);

    border:2px solid rgba(0,255,255,.4);

    backdrop-filter:blur(15px);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;

    box-shadow:
        0 0 20px rgba(0,255,255,.4),
        inset 0 0 20px rgba(0,255,255,.2);
}

.kd{
    left:40px;
    top:240px;
}

.acc{
    right:40px;
    top:240px;
}

.circle h1{
    color:#00e5ff;
}

/* MINI MAP */

.map{
    position:absolute;
    left:40px;
    bottom:180px;

    width:130px;
    height:90px;

    border-radius:15px;
}

/* WEAPON PANEL */

.weapon{
    position:absolute;
    right:40px;
    bottom:180px;

    width:140px;
    height:90px;

    border-radius:15px;
}

/* MODES */

.modes{
    position:absolute;

    left:50%;
    bottom:110px;

    transform:translateX(-50%);

    display:flex;
    gap:20px;
}

.mode{
    width:180px;
    height:80px;

    border:none;

    border-radius:20px;

    color:#00e5ff;

    font-size:30px;

    cursor:pointer;
}

.mode small{
    display:block;
    color:white;
    font-size:14px;
}

/* BOTTOM */

.bottom{
    position:fixed;

    left:15px;
    right:15px;
    bottom:15px;

    height:80px;

    border-radius:25px;

    display:flex;
}

.bottom button{
    flex:1;

    background:none;

    border:none;

    color:white;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:5px;
}

.bottom img{
    width:34px;
    height:34px;
}

.bottom svg{
    width:30px;
    height:30px;
}

/* MOBILE */

@media(max-width:700px){

    .player{
        width:220px;
        transform:scale(.9);
        transform-origin:left top;
    }

    .currency{
        transform:scale(.9);
        transform-origin:right top;
    }

    .circle{
        width:100px;
        height:100px;
    }

    .mode{
        width:150px;
        font-size:24px;
    }
}

</style>
</head>

<body>

<img src="./images/bg.png" class="bg">

<!-- PLAYER -->

<div class="player glass">

    <div class="avatar">
        <i data-lucide="user"></i>
    </div>

    <div>
        <small>COMMANDER</small>

        <h2>
            PlayerOne
            <span>// LV 24</span>
        </h2>

        <div class="xp">
            <div class="fill"></div>
        </div>
    </div>

</div>

<!-- CURRENCY -->

<div class="currency glass">

    <div class="item">
        <img src="./images/coin.png">
        <span>1200</span>
    </div>

    <div class="item">
        <img src="./images/gem.png">
        <span>45</span>
    </div>

    <div class="item">
        <img src="./images/token.png">
        <span>10</span>
    </div>

</div>

<!-- CHARACTER -->

<div class="character">
    SYRIX<br>SOLDIER
</div>

<!-- KD -->

<div class="circle kd">
    <small>K/D</small>
    <h1>1.85</h1>
</div>

<!-- ACCURACY -->

<div class="circle acc">
    <small>ACCURACY</small>
    <h1>68%</h1>
</div>

<!-- MAP -->

<div class="map glass"></div>

<!-- WEAPON -->

<div class="weapon glass"></div>

<!-- MODES -->

<div class="modes">

    <button class="mode glass">
        ▶ 1v1
        <small>COMPETITIVE</small>
    </button>

    <button class="mode glass">
        ▶ LV MODE
        <small>LEVELS</small>
    </button>

</div>

<!-- BOTTOM -->

<div class="bottom glass">

    <button>
        <i data-lucide="shopping-cart"></i>
        <span>STORE</span>
    </button>

    <button>
        <img src="./images/weapons.png">
        <span>WEAPONS</span>
    </button>

    <button>
        <img src="./images/characters.png">
        <span>CHARACTERS</span>
    </button>

    <button>
        <i data-lucide="settings"></i>
        <span>SETTINGS</span>
    </button>

</div>

<script>

lucide.createIcons();

if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js");
}

</script>

</body>
    </html>
