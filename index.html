<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syrix Arena | Home</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: white; overflow: hidden; }
        
        /* Background */
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('images/bg.png') no-repeat center center/cover;
            z-index: -1;
        }

        /* Floating HUD containers */
        .hud-pill {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 50px;
            position: fixed;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Top HUD */
        .top-bar { top: 20px; left: 20px; right: 20px; justify-content: space-between; }
        .currency-bar { display: flex; gap: 15px; }
        .curr { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .curr img { width: 20px; height: 20px; }

        /* Bottom Navigation (Floating) */
        .bottom-nav { 
            bottom: 20px; left: 50%; transform: translateX(-50%); 
            padding: 10px 30px; gap: 30px;
        }
        .nav-btn { 
            background: none; border: none; color: white; 
            display: flex; flex-direction: column; align-items: center; gap: 2px; 
            cursor: pointer; opacity: 0.8; transition: 0.3s;
        }
        .nav-btn:hover { opacity: 1; }
        
        /* Icon Sizing */
        .nav-btn img { width: 24px; height: 24px; }
        .elite-icon { stroke: #00f0ff; width: 24px; height: 24px; filter: drop-shadow(0 0 5px rgba(0,240,255,0.5)); }
        .nav-btn span { font-size: 9px; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>

    <!-- Top HUD Pill -->
    <div class="hud-pill top-bar">
        <div class="profile" style="display:flex; align-items:center; gap:8px;">
            <i data-lucide="user" class="elite-icon"></i>
            <span style="font-size: 13px;">PlayerOne</span>
        </div>
        <div class="currency-bar">
            <div class="curr"><img src="images/coin.png"> <span>1,200</span></div>
            <div class="curr"><img src="images/gem.png"> <span>45</span></div>
            <div class="curr"><img src="images/token.png"> <span>10</span></div>
        </div>
    </div>

    <!-- Bottom Navigation Pill -->
    <nav class="hud-pill bottom-nav">
        <button class="nav-btn"><i data-lucide="shopping-bag" class="elite-icon"></i><span>STORE</span></button>
        <button class="nav-btn"><img src="images/weapons.png"><span>WEAPONS</span></button>
        <button class="nav-btn"><img src="images/characters.png"><span>CHARS</span></button>
        <button class="nav-btn"><i data-lucide="settings" class="elite-icon"></i><span>SETTINGS</span></button>
    </nav>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
