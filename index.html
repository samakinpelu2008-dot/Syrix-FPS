<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syrix Arena | Home</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: white; overflow: hidden; }
        
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('images/bg.png') no-repeat center center/cover;
            z-index: -1;
        }

        /* Top HUD */
        .top-bar { display: flex; justify-content: space-between; padding: 20px; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); align-items: center; }
        .profile { display: flex; align-items: center; gap: 10px; }
        .currency-bar { display: flex; gap: 15px; }
        .curr { display: flex; align-items: center; gap: 5px; }
        .curr img { width: 24px; height: 24px; }

        /* Bottom Navigation */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; display: flex; 
            justify-content: space-around; padding: 15px; 
            background: rgba(0,0,0,0.5); backdrop-filter: blur(15px);
        }
        .nav-btn { background: none; border: none; color: white; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        
        /* Icon sizes */
        .nav-btn img { width: 35px; height: 35px; } /* Custom images */
        .elite-icon { stroke: #00f0ff; width: 30px; height: 30px; filter: drop-shadow(0 0 5px rgba(0,240,255,0.5)); }
    </style>
</head>
<body>

    <div class="bg-layer"></div>

    <div class="top-bar">
        <div class="profile">
            <i data-lucide="user" class="elite-icon"></i>
            <span>PlayerOne | LV 24</span>
        </div>
        <div class="currency-bar">
            <div class="curr"><img src="images/coin.png" alt="Coin"> <span>1,200</span></div>
            <div class="curr"><img src="images/gem.png" alt="Gem"> <span>45</span></div>
            <div class="curr"><img src="images/token.png" alt="Token"> <span>10</span></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn"><i data-lucide="shopping-bag" class="elite-icon"></i><span>STORE</span></button>
        <button class="nav-btn"><img src="images/weapons.png" alt="Weapons"><span>WEAPONS</span></button>
        <button class="nav-btn"><img src="images/characters.png" alt="Characters"><span>CHARS</span></button>
        <button class="nav-btn"><i data-lucide="settings" class="elite-icon"></i><span>SETTINGS</span></button>
    </nav>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
