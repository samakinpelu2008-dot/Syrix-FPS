<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0c16">
    <title>Syrix Combat Arena</title>
    
    <link rel="manifest" href="./manifest.json">
    
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            user-select: none; -webkit-user-select: none; touch-action: none; 
        }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #0b0c16; font-family: system-ui, -apple-system, sans-serif; position: fixed; 
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Crosshairs & Scopes */
        #reticle { 
            position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; 
            background: #00f0ff; border-radius: 50%; transform: translate(-50%, -50%); 
            pointer-events: none; z-index: 50; box-shadow: 0 0 8px #00f0ff; transition: opacity 0.1s;
        }
        #sniper-scope {
            position: absolute; top: 50%; left: 50%; width: min(82vw, 82vh); height: min(82vw, 82vh);
            transform: translate(-50%, -50%) scale(1.1); border-radius: 50%;
            box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.99); border: 2px solid #ff0055;
            pointer-events: none; z-index: 100; opacity: 0; transition: opacity 0.15s, transform 0.15s;
        }
        #sniper-scope::before, #sniper-scope::after { content: ''; position: absolute; background: rgba(255, 0, 85, 0.4); }
        #sniper-scope::before { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-50%); }
        #sniper-scope::after { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-50%); }
        #sniper-scope.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* Combat Alerts */
        #hit-marker {
            position: absolute; top: 50%; left: 50%; width: 22px; height: 22px;
            transform: translate(-50%, -50%) rotate(45deg); opacity: 0; pointer-events: none; z-index: 160;
        }
        #hit-marker::before, #hit-marker::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 6px #fff; }
        #hit-marker::before { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
        #hit-marker::after { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }

        #damage-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 150; opacity: 0;
            background: radial-gradient(ellipse at center, rgba(255,0,85,0) 40%, rgba(255,0,85,0.45) 100%); transition: opacity 0.1s;
        }

        /* Responsive HUD */
        .hud-screen { 
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; 
            z-index: 200; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-end; padding: 24px; 
        }
        .hud-element { 
            background: rgba(15, 23, 42, 0.55); border: 1px solid rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: #fff; font-family: monospace; pointer-events: auto; 
        }

        .zone-left { display: flex; flex-direction: column; gap: 20px; width: 200px; }
        .btn-run { 
            width: 54px; height: 54px; border-radius: 50%; font-size: 11px; display: flex; justify-content: center; align-items: center;
            border-color: rgba(255, 0, 85, 0.3); color: #ff0055; margin-left: 20px; font-weight: bold;
        }
        .btn-run.active { background: rgba(255, 0, 85, 0.25); border-color: #ff0055; color: #fff; box-shadow: 0 0 15px #ff0055; }

        .joystick-container { 
            position: absolute; width: 110px; height: 110px; border-radius: 50%; 
            border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.02); opacity: 0.4; pointer-events: none; 
            display: flex; justify-content: center; align-items: center;
        }
        .joystick-knob { width: 40px; height: 40px; background: #ffffff; box-shadow: 0 0 10px rgba(255,255,255,0.5); border-radius: 50%; }

        .zone-center { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 5px; }
        .weapon-box { 
            width: 320px; height: 58px; border-radius: 12px; display: flex; padding: 4px; gap: 6px; 
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.15); 
        }
        .gun-slot { 
            flex: 1; height: 100%; border-radius: 8px; border: 1px solid transparent; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 11px; color: #64748b; 
        }
        .gun-slot.active { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.25); color: #ffffff; }
        .gun-ammo { font-size: 9px; opacity: 0.8; margin-top: 1px; }

        .hp-frame { width: 180px; height: 6px; background: rgba(0,0,0,0.6); border-radius: 3px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #00f0ff); box-shadow: 0 0 8px #ff0055; }

        .zone-right { display: grid; grid-template-areas: ". jump" "scope crouch" "fire fire"; gap: 15px; }
        .btn-hud-action { display: flex; justify-content: center; align-items: center; border-radius: 50%; font-weight: bold; }
        .btn-jump { grid-area: jump; width: 56px; height: 56px; font-size: 10px; border-color: rgba(255,255,255,0.2); color: #f1f5f9; }
        .btn-crouch { grid-area: crouch; width: 56px; height: 56px; font-size: 10px; border-color: rgba(255,255,255,0.2); color: #f1f5f9; }
        .btn-scope { grid-area: scope; width: 60px; height: 60px; font-size: 11px; border-color: rgba(56,189,248,0.3); color: #38bdf8; }
        .btn-fire { 
            grid-area: fire; width: 95px; height: 95px; font-size: 15px; background: rgba(239, 68, 68, 0.1); 
            border-color: rgba(239, 68, 68, 0.35); color: #ef4444; text-shadow: 0 0 5px #ef4444; 
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="reticle"></div>
    <div id="hit-marker"></div>
    <div id="sniper-scope"></div>
    <div id="damage-vignette"></div>
    <div id="canvas-container"></div>

    <div class="joystick-container hud-element" id="joystick-zone" style="left: 40px; bottom: 40px;">
        <div class="joystick-knob" id="joystick-handle"></div>
    </div>

    <div class="hud-screen">
        <div class="zone-left">
            <div class="btn-run hud-element" id="action-run">RUN</div>
        </div>
        
        <div class="zone-center">
            <div class="weapon-box">
                <div class="gun-slot active" id="weapon-0">
                    <div style="font-weight:bold;">ALPHA-R</div>
                    <div class="gun-ammo" id="ammo-txt-0">30/120</div>
                </div>
                <div class="gun-slot" id="weapon-1">
                    <div style="font-weight:bold;">BETA-P</div>
                    <div class="gun-ammo" id="ammo-txt-1">7/28</div>
                </div>
                <div class="gun-slot" id="weapon-2">
                    <div style="font-weight:bold;">GAMMA-S</div>
                    <div class="gun-ammo" id="ammo-txt-2">6/24</div>
                </div>
            </div>
            <div class="hp-frame"><div class="hp-fill" id="hp-fill-bar"></div></div>
        </div>
        
        <div class="zone-right">
            <div class="btn-hud-action btn-jump hud-element" id="btn-jump">JUMP</div>
            <div class="btn-hud-action btn-crouch hud-element" id="btn-crouch">CROUCH</div>
            <div class="btn-hud-action btn-scope hud-element" id="btn-scope">SCOPE</div>
            <div class="btn-hud-action btn-fire hud-element" id="btn-fire">FIRE</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { buildMapArena } from './map.js';
        import { TacticalControls } from './action.js';
        import { EnemyManager } from './enemies.js';
        import { AudioEngine } from './audio.js';

        // PWA Standalone Activation Lifecycle Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log("SW failed: ", err));
            });
        }

        // Initialize Base Graphics Context
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb4c6ef);
        scene.fog = new THREE.FogExp2(0xb4c6ef, 0.01);
        
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 500);
        camera.rotation.order = 'YXZ'; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xfff4dd, 1.2);
        sun.position.set(80, 120, 50); sun.castShadow = true;
        sun.shadow.mapSize.width = 1024; sun.shadow.mapSize.height = 1024;
        scene.add(sun);

        // Core Systems Instances Linkages
        const audio = new AudioEngine();
        const unlock = () => audio.unlock();
        window.addEventListener('touchstart', unlock, { once: true });
        window.addEventListener('mousedown', unlock, { once: true });

        buildMapArena(scene);
        const combat = new TacticalControls(scene, camera);
        const enemies = new EnemyManager(scene);
        combat.audio = audio; combat.enemyManager = enemies;

        // Desktop fallback inputs
        window.addEventListener('mousemove', (e) => {
            if(e.buttons === 1 && e.clientX > window.innerWidth/2 && !e.target.closest('.weapon-box')) {
                camera.rotation.y -= e.movementX * 0.003; camera.rotation.x -= e.movementY * 0.003;
                camera.rotation.x = Math.max(-1.3, Math.min(1.3, camera.rotation.x));
            }
        });

        // Run Loop Clock Core
        const clock = new THREE.Clock();
        function loop() {
            requestAnimationFrame(loop);
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            let targetFOV = combat.adsMode ? 28 : 65;
            if(combat.running && !combat.adsMode) targetFOV = 74;
            camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, 0.15);
            camera.updateProjectionMatrix();

            combat.update(delta, time);
            enemies.update(delta, camera.position, (dmg) => combat.takeDamage(dmg), audio);

            scene.traverse(obj => {
                if(obj.userData && obj.userData.isBillboard) obj.lookAt(camera.position.x, obj.position.y, camera.position.z);
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loop();
    </script>
</body>
</html>
