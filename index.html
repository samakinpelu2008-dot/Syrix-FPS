<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Syrix Arena</title>

<link rel="manifest" href="manifest.json">

<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    width:100vw;
    height:100vh;
    background:#000;
}

.background{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

.glass{
    background:rgba(20,25,35,0.45);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 0 25px rgba(0,255,255,0.2);
}

.top-bar{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.profile{
    width:220px;
    padding:15px;
    border-radius:20px;
    color:white;
}

.profile h2{
    font-size:20px;
}

.profile small{
    color:#aaa;
}

.xp-bar{
    width:100%;
    height:6px;
    background:#333;
    border-radius:20px;
    margin-top:10px;
}

.xp-fill{
    width:75%;
    height:100%;
    background:#00d9ff;
    border-radius:20px;
}

.currency{
    display:flex;
    gap:10px;
    padding:10px 20px;
    border-radius:20px;
}

.currency-item{
    display:flex;
    align-items:center;
    gap:5px;
    color:white;
}

.currency-item img{
    width:30px;
}

.character-area{
    position:absolute;
    top:90px;
    bottom:120px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.character-placeholder{
    width:220px;
    height:360px;
    border-radius:30px;
    border:2px dashed rgba(255,255,255,0.3);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:20px;
}

.left-card,
.right-card{
    position:absolute;
    top:220px;
    width:120px;
    height:120px;
    border-radius:20px;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.left-card{
    left:15px;
}

.right-card{
    right:15px;
}

.bottom-buttons{
    position:absolute;
    bottom:110px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:20px;
}

.mode{
    width:160px;
    height:80px;
    border:none;
    border-radius:20px;
    color:white;
    font-size:20px;
}

.navbar{
    position:absolute;
    left:10px;
    right:10px;
    bottom:10px;
    height:80px;
    border-radius:30px;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav-btn{
    background:none;
    border:none;
    color:white;
}

.nav-btn img{
    width:40px;
    height:40px;
}

</style>
</head>

<body>

<img src="./images/bg.png" class="background">

<div class="top-bar">

    <div class="profile glass">
        <small>COMMANDER</small>
        <h2>PlayerOne</h2>

        <div class="xp-bar">
            <div class="xp-fill"></div>
        </div>
    </div>

    <div class="currency glass">

        <div class="currency-item">
            <img src="./images/coin.png">
            <span>1200</span>
        </div>

        <div class="currency-item">
            <img src="./images/gem.png">
            <span>45</span>
        </div>

        <div class="currency-item">
            <img src="./images/token.png">
            <span>10</span>
        </div>

    </div>

</div>
