<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<title>Syrix Arena</title>

<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

:root{
    --cyan:#22d6ff;
    --cyan-soft:rgba(34,214,255,.55);
    --panel:rgba(6,14,24,.58);
    --panel-strong:rgba(4,10,18,.72);
    --ink:#eaf7ff;
    --dim:#8fa9b8;
    --gold-1:#ffe27a;
    --gold-2:#ffc534;
    --gold-3:#e2860a;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Rajdhani',Arial,sans-serif;
    background:#02060a;
}

body{
    background:url("images/bg.png") center/cover no-repeat,#02060a;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 100%);
    pointer-events:none;
}

.overlay{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    height:100%;
    font-size:1vw;
}

button,select{
    font-family:inherit;
    cursor:pointer;
}

/* glass panel base */
.glass{
    background:var(--panel);
    border:1px solid var(--cyan-soft);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 0 0 1px rgba(34,214,255,.08) inset,0 8px 18px rgba(0,0,0,.35);
}

/* ============ PROFILE ============ */

.profile{
    position:absolute;
    top:1.8vw;
    left:1.4vw;
    width:21vw;
    max-width:300px;
    height:7.2vw;
    max-height:100px;
    border-radius:1.4vw;
    display:flex;
    align-items:center;
    gap:.9vw;
    padding:.8vw 1vw;
}

.avatar-wrap{
    position:relative;
    width:5.4vw;
    height:5.4vw;
    max-width:74px;
    max-height:74px;
    flex-shrink:0;
}

.avatar-fallback{
    position:absolute;
    inset:0;
    border-radius:.7vw;
    background:linear-gradient(155deg,#1b3a4a,#0a1620);
    border:1px solid rgba(34,214,255,.6);
}

.avatar{
    position:relative;
    width:100%;
    height:100%;
    border-radius:.7vw;
    object-fit:cover;
    display:block;
}

.rank-badge{
    position:absolute;
    top:-.5vw;
    right:-.5vw;
    width:1.7vw;
    height:1.7vw;
    min-width:22px;
    min-height:22px;
    border-radius:50%;
    background:#0c1924;
    border:1px solid var(--cyan);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--cyan);
}

.rank-badge i{width:60%;height:60%;}

.profile-info{
    display:flex;
    flex-direction:column;
    gap:.5vw;
    min-width:0;
}

.player-name{
    color:var(--ink);
    font-weight:700;
    font-size:1.25vw;
    letter-spacing:.03em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.level-row{
    display:flex;
    align-items:center;
    gap:.5vw;
}

.level-label{
    color:var(--dim);
    font-size:.85vw;
    font-weight:600;
    white-space:nowrap;
}

.level-bar{
    flex:1;
    height:.5vw;
    min-height:6px;
    border-radius:1vw;
    background:rgba(255,255,255,.12);
    overflow:hidden;
}

.level-fill{
    height:100%;
    width:55%;
    border-radius:1vw;
    background:linear-gradient(90deg,#1aa6ff,var(--cyan));
}

/* ============ TOP ICONS ============ */

.top-icons{
    position:absolute;
    top:1.8vw;
    left:24vw;
    display:flex;
    gap:.8vw;
}

.icon-btn{
    position:relative;
    width:3.8vw;
    height:3.8vw;
    max-width:54px;
    max-height:54px;
    border-radius:.9vw;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    border-radius:.9vw;
}

.icon-btn i{width:48%;height:48%;}

.icon-btn .dot{
    position:absolute;
    top:-.3vw;
    right:-.3vw;
    width:.7vw;
    height:.7vw;
    min-width:8px;
    min-height:8px;
    border-radius:50%;
    background:#ff3b3b;
    border:1px solid #02060a;
}

/* ============ LOGO ============ */

.logo{
    position:absolute;
    top:1.1vw;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.2vw;
}

.logo-icon{
    width:3vw;
    height:3vw;
    color:var(--cyan);
    filter:drop-shadow(0 0 10px rgba(34,214,255,.85));
}

.logo-text{
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:2.4vw;
    letter-spacing:.04em;
    line-height:1;
    white-space:nowrap;
}

.logo-text .w{color:#f4fbff;text-shadow:0 0 14px rgba(255,255,255,.35);}
.logo-text .c{color:var(--cyan);text-shadow:0 0 18px rgba(34,214,255,.9);}

/* ============ CURRENCY ============ */

.currency{
    position:absolute;
    top:1.8vw;
    right:1.4vw;
    display:flex;
    gap:.7vw;
}

.money{
    display:flex;
    align-items:center;
    gap:.5vw;
    height:3.8vw;
    max-height:54px;
    padding:0 .5vw 0 .7vw;
    border-radius:1.4vw;
    color:var(--ink);
    font-weight:700;
    font-size:1.05vw;
}

.money img,.money i{
    width:1.7vw;
    height:1.7vw;
    min-width:22px;
    min-height:22px;
    object-fit:contain;
}

.plus-btn{
    margin-left:.3vw;
    border:none;
    background:none;
    color:var(--cyan);
    font-size:1.7vw;
    font-weight:800;
    line-height:1;
    padding:0;
    text-shadow:0 0 8px rgba(34,214,255,.7);
}

/* ============ LEFT MENU ============ */

.left-menu{
    position:absolute;
    top:11vw;
    left:1.4vw;
    display:flex;
    flex-direction:column;
    gap:1vw;
    width:18vw;
    max-width:255px;
}

.menu-btn{
    height:4.3vw;
    max-height:62px;
    border-radius:1vw;
    border:none;
    display:flex;
    align-items:center;
    gap:.9vw;
    padding:0 1vw;
    color:var(--ink);
    font-weight:700;
    font-size:1.05vw;
    letter-spacing:.03em;
}

.menu-icon{
    width:2.6vw;
    height:2.6vw;
    min-width:34px;
    min-height:34px;
    border-radius:.7vw;
    background:rgba(34,214,255,.14);
    border:1px solid var(--cyan-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--cyan);
    flex-shrink:0;
}

.menu-icon i{width:58%;height:58%;}

/* ============ FRIENDS (projector drop-down) ============ */

.friends-card{
    position:absolute;
    top:11vw;
    right:1.4vw;
    width:20.5vw;
    max-width:295px;
    border-radius:1.4vw;
    overflow:hidden;
    z-index:40;
}

.friends-head{
    width:100%;
    display:flex;
    align-items:center;
    gap:.6vw;
    padding:.9vw 1.1vw;
    border:none;
    background:none;
    color:var(--ink);
    font-weight:800;
    font-size:1.05vw;
    letter-spacing:.06em;
}

.friends-head i:first-child{width:1.2vw;height:1.2vw;color:var(--cyan);flex-shrink:0;}

.friends-count{
    margin-left:auto;
    background:rgba(34,214,255,.14);
    border:1px solid var(--cyan-soft);
    color:var(--cyan);
    border-radius:1vw;
    padding:.15vw .7vw;
    font-size:.85vw;
    font-weight:700;
    letter-spacing:.02em;
}

.friends-chevron{
    width:1.15vw;
    height:1.15vw;
    color:var(--dim);
    flex-shrink:0;
    transition:transform .35s ease;
}

.friends-card.open .friends-chevron{transform:rotate(180deg);}

.friends-screen{
    max-height:0;
    overflow:hidden;
    transition:max-height .45s cubic-bezier(.4,0,.2,1);
}

.friends-card.open .friends-screen{
    max-height:18vw;
}

.screen-bar{
    height:.3vw;
    margin:0 1.1vw .5vw;
    border-radius:1vw;
    background:linear-gradient(90deg,rgba(34,214,255,.05),var(--cyan-soft) 50%,rgba(34,214,255,.05));
}

.friends-list{
    max-height:17.5vw;
    overflow-y:auto;
    padding:0 1.1vw 1vw;
    display:flex;
    flex-direction:column;
    border-top:1px solid rgba(34,214,255,.18);
}

.friends-list::-webkit-scrollbar{width:.35vw;}
.friends-list::-webkit-scrollbar-track{background:transparent;}
.friends-list::-webkit-scrollbar-thumb{background:rgba(34,214,255,.45);border-radius:1vw;}

.friend{
    display:flex;
    align-items:center;
    gap:.7vw;
    padding:.55vw 0;
    flex-shrink:0;
}

.friend-avatar{
    width:2.9vw;
    height:2.9vw;
    min-width:38px;
    min-height:38px;
    border-radius:.7vw;
    flex-shrink:0;
    background:linear-gradient(155deg,#2a4a5c,#0c1a22);
    border:1px solid rgba(34,214,255,.4);
}

.friend-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:.15vw;
}

.friend-name{
    color:var(--ink);
    font-weight:700;
    font-size:.95vw;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.friend-status{
    display:flex;
    align-items:center;
    gap:.35vw;
    font-size:.75vw;
    font-weight:600;
    letter-spacing:.04em;
}

.friend-status .pulse{
    width:.45vw;
    height:.45vw;
    min-width:6px;
    min-height:6px;
    border-radius:50%;
}

.status-online{color:#4ee08a;}
.status-online .pulse{background:#4ee08a;box-shadow:0 0 6px #4ee08a;}
.status-offline{color:#7b8b96;}
.status-offline .pulse{background:#7b8b96;}

.friend-add{
    width:1.9vw;
    height:1.9vw;
    min-width:24px;
    min-height:24px;
    border-radius:.5vw;
    background:rgba(34,214,255,.1);
    border:1px solid var(--cyan-soft);
    color:var(--cyan);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.friend-add i{width:60%;height:60%;}

/* ============ MODE + START ============ */

.mode-card{
    position:absolute;
    right:1.4vw;
    bottom:7.9vw;
    width:20.5vw;
    max-width:295px;
    border-radius:1.1vw;
    overflow:hidden;
}

.mode-row{
    display:flex;
    align-items:center;
    gap:.6vw;
    padding:.85vw 1vw;
    color:var(--ink);
}

.mode-row.main{
    font-weight:700;
    font-size:1.05vw;
    letter-spacing:.04em;
}

.mode-row.main i:first-child{color:var(--cyan);width:1.2vw;height:1.2vw;}
.mode-row.main .chev{margin-left:auto;width:1.1vw;height:1.1vw;color:var(--dim);}

.start-btn{
    position:absolute;
    right:1.4vw;
    bottom:1.6vw;
    width:20.5vw;
    max-width:295px;
    height:5.4vw;
    max-height:78px;
    border:none;
    border-radius:1.1vw;
    background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
    color:#1a1100;
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:1.9vw;
    letter-spacing:.04em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.6vw;
    box-shadow:0 .5vw 1.4vw rgba(255,197,52,.45),0 0 0 1px rgba(255,255,255,.3) inset;
}

.start-btn i{width:1.5vw;height:1.5vw;fill:#1a1100;}

/* ============ MODE PICKER OVERLAY ============ */

.mode-picker-backdrop{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    z-index:300;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    transition:opacity .3s ease;
    background:#02060a;
}

.mode-picker-backdrop.show{opacity:1;visibility:visible;}

.mode-picker-bg{
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:url("images/mode-bg.png") center/cover no-repeat,linear-gradient(160deg,#0a1a26,#02060a);
}

.mode-picker-bg::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:linear-gradient(180deg,rgba(2,6,10,.55),rgba(2,6,10,.88));
}

.mode-picker-close{
    position:absolute;
    top:2.2vw;
    right:2.2vw;
    width:2.6vw;
    height:2.6vw;
    min-width:34px;
    min-height:34px;
    border:1px solid var(--cyan-soft);
    background:rgba(8,16,26,.7);
    border-radius:50%;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
}

.mode-picker-close i{width:55%;height:55%;}

.mode-picker-title{
    position:relative;
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:1.6vw;
    color:var(--ink);
    letter-spacing:.08em;
    margin-bottom:2.2vw;
    text-shadow:0 0 14px rgba(34,214,255,.5);
    z-index:2;
}

.mode-picker-row{
    position:relative;
    display:flex;
    gap:1.4vw;
    padding:0 2vw;
    max-width:96vw;
    overflow-x:auto;
    z-index:2;
}

.mode-option{
    position:relative;
    flex-shrink:0;
    width:18vw;
    max-width:250px;
    height:26vw;
    max-height:340px;
    border-radius:1.2vw;
    border:1px solid var(--cyan-soft);
    background-size:cover;
    background-position:center;
    background-color:#0a1620;
    overflow:hidden;
    transition:transform .15s ease;
}

.mode-option:active{transform:scale(.96);}

.mode-option-label{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:1vw .8vw;
    background:linear-gradient(180deg,rgba(2,6,10,0),rgba(2,6,10,.92));
    text-align:center;
}

.mode-option-label .name{
    display:block;
    color:var(--ink);
    font-weight:700;
    font-size:1vw;
    letter-spacing:.03em;
}

.mode-option-label .rank{
    display:block;
    color:var(--cyan);
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:.85vw;
    letter-spacing:.06em;
    margin-top:.2vw;
}

.mode-option.play-now .mode-option-label{
    background:linear-gradient(180deg,rgba(2,6,10,0),rgba(120,80,0,.9));
}

/* ============ CHAT ============ */

.chat{
    position:absolute;
    left:1.4vw;
    bottom:1.6vw;
    width:20.5vw;
    max-width:295px;
    height:3.6vw;
    max-height:52px;
    border-radius:1.4vw;
    display:flex;
    align-items:center;
    gap:.6vw;
    padding:0 1vw;
    color:var(--ink);
}

.chat>i:first-child{width:1.3vw;height:1.3vw;color:var(--cyan);flex-shrink:0;}

.chat-text{
    display:flex;
    flex-direction:column;
    gap:.05vw;
    flex:1;
    min-width:0;
}

.chat-text b{
    font-size:.78vw;
    letter-spacing:.08em;
    color:var(--cyan);
}

.chat-text span{
    font-size:.85vw;
    color:var(--dim);
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-arrow{width:1vw;height:1vw;color:var(--dim);flex-shrink:0;}

/* ============ BOTTOM BAR ============ */

.bottom-bar{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:54vw;
    max-width:780px;
    height:5.6vw;
    max-height:80px;
    border-radius:1.4vw 1.4vw 0 0;
    display:flex;
    border-bottom:none;
}

.bottom-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:.3vw;
    color:var(--ink);
    font-weight:700;
    font-size:.85vw;
    letter-spacing:.02em;
    position:relative;
    background:none;
    border:none;
}

.bottom-btn:not(:last-child)::after{
    content:"";
    position:absolute;
    right:0;
    top:30%;
    height:40%;
    width:1px;
    background:rgba(34,214,255,.18);
}

.bottom-btn img,.bottom-btn i{
    width:1.9vw;
    height:1.9vw;
    min-width:24px;
    min-height:24px;
    object-fit:contain;
    color:var(--cyan);
}

.bottom-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:1.6vw;
    height:.25vw;
    background:linear-gradient(90deg,var(--gold-2),var(--gold-1));
    border-radius:0 0 .3vw .3vw;
    opacity:.55;
}

.bottom-btn.active::before{opacity:1;}

/* ============ MOBILE PORTRAIT ============ */

@media(max-width:800px) and (orientation:portrait){

.overlay{font-size:2vw;}

.profile{width:48vw;height:15vw;left:2.5vw;top:2.5vw;}
.avatar-wrap{width:11vw;height:11vw;}
.player-name{font-size:2.6vw;}
.level-label{font-size:1.8vw;}

.top-icons{left:auto;right:2.5vw;top:18.5vw;}
.icon-btn{width:8vw;height:8vw;}

.logo{top:2.5vw;}
.logo-icon{width:6vw;height:6vw;}
.logo-text{font-size:5vw;}

.currency{left:2.5vw;right:2.5vw;top:18.5vw;justify-content:flex-start;}
.money{height:7vw;font-size:2.2vw;}
.money img,.money i{width:3.5vw;height:3.5vw;}

.left-menu{top:27vw;left:2.5vw;width:44vw;gap:2vw;}
.menu-btn{height:9vw;font-size:2.2vw;}
.menu-icon{width:5.5vw;height:5.5vw;}

.friends-card{display:none;}

.mode-card{left:2.5vw;right:2.5vw;width:auto;bottom:26vw;}
.mode-row.main{font-size:2.2vw;}
.start-btn{left:2.5vw;right:2.5vw;width:auto;bottom:13vw;height:11vw;font-size:4vw;}

.chat{left:2.5vw;width:44vw;height:8vw;bottom:1.6vw;}
.chat-text b{font-size:1.6vw;}
.chat-text span{font-size:1.8vw;}

.bottom-bar{width:92vw;height:10vw;}
.bottom-btn{font-size:1.7vw;}
.bottom-btn img,.bottom-btn i{width:4vw;height:4vw;}

.mode-picker-title{font-size:3.6vw;margin-bottom:4vw;}
.mode-picker-close{width:7vw;height:7vw;top:4vw;right:4vw;}
.mode-picker-row{gap:3vw;padding:0 4vw;}
.mode-option{width:58vw;height:78vw;max-height:none;}
.mode-option-label .name{font-size:2.4vw;}
.mode-option-label .rank{font-size:2vw;}

}

</style>
</head>

<body>

<div class="overlay">

<!-- profile -->
<div class="profile glass">
    <div class="avatar-wrap" id="avatarBtn">
        <div class="avatar-fallback"></div>
        <img class="avatar" src="images/avatar.png" alt="" onerror="this.style.display='none'">
        <div class="rank-badge"><i data-lucide="shield"></i></div>
    </div>
    <div class="profile-info">
        <div class="player-name">PLAYER NAME</div>
        <div class="level-row">
            <span class="level-label">Lv. 50</span>
            <div class="level-bar"><div class="level-fill"></div></div>
        </div>
    </div>
</div>

<!-- bell / settings -->
<div class="top-icons">
    <button class="icon-btn glass nav-link" data-page="notification.html">
        <i data-lucide="bell"></i>
        <span class="dot"></span>
    </button>

<script>
lucide.createIcons();

/* page navigation - store, l-arena, events, weapons, characters,
   leaderboard, notification, settings all just route out via data-page */
document.querySelectorAll('.nav-link').forEach(function(el){
    el.addEventListener('click',function(){
        var page=el.getAttribute('data-page');
        if(page)window.location.href=page;
    });
});

/* match type picker - tap CS-RANKED row, choose a big card, it closes
   and updates the label START will read from */
var selectedMode='BA RANKED';
var modeLabel=document.getElementById('modeLabel');
var modeCardBtn=document.getElementById('modeCardBtn');
var modePickerBackdrop=document.getElementById('modePickerBackdrop');
var modePickerClose=document.getElementById('modePickerClose');

modeCardBtn.addEventListener('click',function(){
    modePickerBackdrop.classList.add('show');
});

modePickerClose.addEventListener('click',function(){
    modePickerBackdrop.classList.remove('show');
});

modePickerBackdrop.addEventListener('click',function(e){
    if(e.target===modePickerBackdrop)modePickerBackdrop.classList.remove('show');
});

document.querySelectorAll('.mode-option').forEach(function(opt){
    opt.addEventListener('click',function(){
        selectedMode=opt.getAttribute('data-mode');
        modeLabel.textContent=selectedMode;
        modePickerBackdrop.classList.remove('show');
    });
});

/* start - hands the chosen match type to start.html */
document.getElementById('startBtn').addEventListener('click',function(){
    sessionStorage.setItem('selectedMode',selectedMode);
    window.location.href='start.html?mode='+encodeURIComponent(selectedMode);
});

if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
}
</script>
