<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0c16">
    <title>Syrix Arena</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            user-select: none; -webkit-user-select: none; touch-action: none; 
        }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #07080e; font-family: system-ui, -apple-system, sans-serif; position: fixed; 
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Premium Glassmorphic Lobby / Home Screen UI */
        #lobby-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(11, 12, 22, 0.88) 0%, #07080e 100%);
            z-index: 500; display: flex; flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lobby-panel {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 50px 80px; border-radius: 28px; text-align: center; box-shadow: 0 40px 80px rgba(0,0,0,0.7);
        }
        .lobby-title {
            font-size: 56px; font-weight: 900; color: #fff; letter-spacing: 8px; margin-bottom: 6px;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
        }
        .lobby-subtitle { font-size: 13px; color: #ff0055; letter-spacing: 6px; margin-bottom: 45px; font-weight: 900; }
        .btn-start {
            padding: 18px 56px; font-size: 20px; font-weight: 900; color: #fff; background: #ff0055;
            border: none; border-radius: 14px; cursor: pointer; letter-spacing: 3px;
            box-shadow: 0 0 30px #ff0055; transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn-start:active { transform: scale(0.95); box-shadow: 0 0 15px #ff0055; }

        /* Dynamic Auto-Aim Lock Crosshair Reticle */
        #reticle { 
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; 
            background: #00f0ff; border-radius: 50%; transform: translate(-50%, -50%); 
            pointer-events: none; z-index: 50; box-shadow: 0 0 10px #00f0ff; transition: background 0.1s, transform 0.1s, box-shadow 0.1s;
        }
        #reticle.lock-on { background: #ff0033; box-shadow: 0 0 16px #ff0033; transform: translate(-50%, -50%) scale(1.5); }

        /* Tactical CODM / FF Minimap Radar Overlays */
        #minimap-container {
            position: absolute; top: 20px; left: 20px; width: 140px; height: 140px;
            border-radius: 14px; border: 2px solid rgba(255, 255, 255, 0.25);
            background: rgba(11, 12, 22, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            overflow: hidden; z-index: 200; pointer-events: none;
        }
        #minimap-radar { width: 100%; height: 100%; position: relative; }
        #minimap-player-dot {
            position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            border-left: 7px solid transparent; border-right: 7px solid transparent;
            border-bottom: 14px solid #00f0ff; transform: translate(-50%, -50%);
        }

        /* Full Screen HUD Overlay Input Mapping System */
        .hud-screen { 
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; 
            z-index: 200; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-end; padding: 24px; 
        }
        .hud-element { 
            background: rgba(15, 23, 42, 0.55); border: 1px solid rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: #fff; font-family: monospace; pointer-events: auto; 
        }

        /* Left Side Combat Flank Controls */
        .zone-left { display: flex; flex-direction: column; gap: 15px; width: 85px; margin-bottom: 20px; margin-left: 10px; }
        .inventory-btn {
            width: 62px; height: 62px; border-radius: 14px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; position: relative; font-size: 11px; font-weight: bold;
        }
        .inv-count { position: absolute; bottom: 4px; right: 8px; font-size: 11px; font-weight: 900; opacity: 0.9; }

        /* Autorun Lock Mechanical Button Profile */
        .btn-run { 
            width: 58px; height: 58px; border-radius: 50%; font-size: 11px; display: flex; justify-content: center; align-items: center;
            border-color: rgba(255, 0, 85, 0.3); color: #ff0055; margin-left: 4px; font-weight: 900; letter-spacing: 1px;
        }
        .btn-run.active { background: rgba(255, 0, 85, 0.25); border-color: #ff0055; color: #fff; box-shadow: 0 0 20px #ff0055; }

        /* Fixed Virtual Joystick Shell Layout */
        .joystick-container { 
            position: absolute; width: 130px; height: 130px; border-radius: 50%; 
            border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.02); opacity: 0.45; pointer-events: none; 
            display: flex; justify-content: center; align-items: center;
        }
        .joystick-knob { width: 48px; height: 48px; background: #ffffff; box-shadow: 0 0 15px rgba(255,255,255,0.6); border-radius: 50%; }

        /* Center Display Custom Weapons Tray Layout */
        .zone-center { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 5px; width: 360px; }
        .weapon-box { 
            width: 100%; height: 66px; border-radius: 14px; display: flex; padding: 5px; gap: 8px; 
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .gun-slot { 
            flex: 1; height: 100%; border-radius: 10px; border: 1px solid transparent; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 12px; color: #64748b; 
        }
        .gun-slot.active { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.25); color: #ffffff; }
        .gun-ammo { font-size: 10px; opacity: 0.8; margin-top: 3px; font-weight: bold; }

        .hp-frame { width: 240px; height: 6px; background: rgba(0,0,0,0.6); border-radius: 3px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #00f0ff); box-shadow: 0 0 10px #ff0055; transition: width 0.1s ease; }

        /* Right Side Tactical Action Input Pad Layout */
        .zone-right { display: grid; grid-template-areas: ". jump" "scope crouch" "fire fire"; gap: 16px; margin-bottom: 10px; }
        .btn-hud-action { display: flex; justify-content: center; align-items: center; border-radius: 50%; font-weight: 900; letter-spacing: 1px; }
        .btn-jump { grid-area: jump; width: 64px; height: 64px; font-size: 11px; border-color: rgba(255,255,255,0.2); }
        .btn-crouch { grid-area: crouch; width: 64px; height: 64px; font-size: 11px; border-color: rgba(255,255,255,0.2); }
        .btn-scope { grid-area: scope; width: 68px; height: 68px; font-size: 11px; border-color: rgba(56,189,248,0.3); color: #38bdf8; transition: opacity 0.15s; }
        .btn-fire { 
            grid-area: fire; width: 110px; height: 110px; font-size: 18px; background: rgba(239, 68, 68, 0.1); 
            border-color: rgba(239, 68, 68, 0.35); color: #ef4444; text-shadow: 0 0 6px #ef4444; 
        }

        /* 3-Second Timing Medkit Progress Display bar */
        #medkit-loader {
            position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
            width: 150px; height: 8px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px; display: none; overflow: hidden; z-index: 300;
        }
        #medkit-progress { width: 0%; height: 100%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }

        /* Full Screen Weapon Scope Layer overlay elements */
        #sniper-scope {
            position: absolute; top: 50%; left: 50%; width: min(84vw, 84vh); height: min(84vw, 84vh);
            transform: translate(-50%, -50%) scale(1.1); border-radius: 50%;
            box-shadow: 0 0 0 9999px rgba(7, 8, 14, 0.99); border: 2px solid #ff0055;
            pointer-events: none; z-index: 100; opacity: 0; transition: opacity 0.15s, transform 0.15s;
        }
        #sniper-scope::before, #sniper-scope::after { content: ''; position: absolute; background: rgba(255, 0, 85, 0.4); }
        #sniper-scope::before { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-50%); }
        #sniper-scope::after { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-50%); }
        #sniper-scope.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        
        #damage-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 150; opacity: 0;
            background: radial-gradient(ellipse at center, rgba(255,0,85,0) 40%, rgba(255,0,85,0.55) 100%); transition: opacity 0.1s;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
            }
        }
    </script>
</head>
<body>

    <!-- Lobby / Home Main Menu Overlay -->
    <div id="lobby-screen">
        <div class="lobby-panel">
            <div class="lobby-title">SYRIX ARENA</div>
            <div class="lobby-subtitle">ELITE COMPETITIVE PLATFORM</div>
            <button class="btn-start" id="btn-match-start">START MATCH</button>
        </div>
    </div>

    <div id="reticle"></div>
    <div id="sniper-scope"></div>
    <div id="damage-vignette"></div>
    <div id="canvas-container"></div>

    <div id="minimap-container">
        <div id="minimap-radar">
            <div id="minimap-player-dot"></div>
        </div>
    </div>

    <div id="medkit-loader"><div id="medkit-progress"></div></div>

    <div class="joystick-container hud-element" id="joystick-zone" style="left: 60px; bottom: 60px;">
        <div class="joystick-knob" id="joystick-handle"></div>
    </div>

    <!-- Active In-Game Mobile Overlay Grid Layout Components -->
    <div class="hud-screen">
        <div class="zone-left">
            <div class="btn-run hud-element" id="action-run">RUN</div>
            
            <div class="inventory-btn hud-element" id="slot-medkit">
                <span style="font-size:20px; color:#22c55e;">✚</span>
                <span class="inv-count" id="count-medkit">2</span>
            </div>
            
            <div class="inventory-btn hud-element" id="slot-gloo">
                <span style="font-size:18px; color:#38bdf8;">🧊</span>
                <span class="inv-count" id="count-gloo">3</span>
            </div>
        </div>
        
        <div class="zone-center">
            <div class="weapon-box">
                <div class="gun-slot active" id="weap-mp5">
                    <div style="font-weight:900; letter-spacing:1px;">MP5 (SMG)</div>
                    <div class="gun-ammo" id="ammo-mp5">30 / 120</div>
                </div>
                <div class="gun-slot" id="weap-m1887">
                    <div style="font-weight:900; letter-spacing:1px;">M1887 (SG)</div>
                    <div class="gun-ammo" id="ammo-m1887">2 / 8</div>
                </div>
            </div>
            <div class="hp-frame"><div class="hp-fill" id="hp-fill-bar"></div></div>
        </div>
        
        <div class="zone-right">
            <div class="btn-hud-action btn-jump hud-element" id="btn-jump">JUMP</div>
            <div class="btn-hud-action btn-crouch hud-element" id="btn-crouch">CROUCH</div>
            <div class="btn-hud-action btn-scope hud-element" id="btn-scope">SCOPE</div>
            <div class="btn-hud-action btn-fire hud-element" id="btn-fire">FIRE</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { buildMapArena } from './map.js';
        import { TacticalControls } from './action.js';
        import { EnemyManager } from './enemies.js';
        import { AudioEngine } from './audio.js';

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(e => console.log(e));
            });
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0e1017);
        scene.fog = new THREE.FogExp2(0x0e1017, 0.012);
        
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 500);
        camera.rotation.order = 'YXZ'; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xfff5df, 1.2);
        sun.position.set(50, 100, 30); sun.castShadow = true;
        scene.add(sun);

        const audio = new AudioEngine();
        buildMapArena(scene);
        
        const combat = new TacticalControls(scene, camera);
        const enemies = new EnemyManager(scene);
        combat.audio = audio; combat.enemyManager = enemies;

        // Lobby Portal Entry Trigger
        document.getElementById('btn-match-start').addEventListener('click', () => {
            audio.unlock();
            document.getElementById('lobby-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('lobby-screen').style.display = 'none';
            }, 500);
        });

        const clock = new THREE.Clock();
        function loop() {
            requestAnimationFrame(loop);
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            // Scope Field of View Transitions
            let targetFOV = combat.adsMode ? 32 : (combat.autorun ? 75 : 65);
            camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, 0.18);
            camera.updateProjectionMatrix();

            combat.update(delta, time);
            enemies.update(delta, camera.position, (dmg) => combat.takeDamage(dmg), audio, combat);

            // Minimap Navigation Tracker Rotation Line
            const viewDir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            const rotAngle = Math.atan2(viewDir.x, -viewDir.z);
            document.getElementById('minimap-player-dot').style.transform = `translate(-50%, -50%) rotate(${rotAngle * (180/Math.PI)}deg)`;

            scene.traverse(obj => {
                if(obj.userData && obj.userData.isBillboard) obj.lookAt(camera.position.x, obj.position.y, camera.position.z);
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loop();
    </script>
</body>
</html>
