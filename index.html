<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Syrix Arena</title>

<link rel="manifest" href="manifest.json">

<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    width:100vw;
    height:100vh;
    color:white;
}

.bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:-1;
}

.glass{
    background:rgba(15,20,35,.45);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 0 20px rgba(0,255,255,.2);
}

/* PLAYER */

.player{
    position:absolute;
    top:15px;
    left:15px;

    width:230px;

    padding:12px;

    border-radius:18px;

    display:flex;
    gap:12px;
}

.avatar{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:rgba(255,255,255,.1);
}

.xp{
    width:120px;
    height:5px;

    background:#333;

    border-radius:20px;

    margin-top:5px;
}

.fill{
    width:70%;
    height:100%;

    border-radius:20px;

    background:#00e5ff;
}

/* CURRENCY */

.currency{
    position:absolute;
    top:15px;
    right:15px;

    padding:10px 15px;

    border-radius:18px;

    display:flex;

    gap:15px;
}

.currency div{
    display:flex;
    align-items:center;
    gap:5px;
}

.currency img{
    width:24px;
}

/* LEFT MENU */

.left-menu{
    position:absolute;
    left:15px;
    top:180px;

    display:flex;
    flex-direction:column;
    gap:10px;
}

.left-menu button{
    width:120px;
    height:40px;

    border:none;

    color:white;

    border-radius:15px;

    background:rgba(15,20,35,.55);

    backdrop-filter:blur(15px);
}

/* RIGHT MENU */

.right-menu{
    position:absolute;
    right:15px;
    top:180px;

    display:flex;
    flex-direction:column;
    gap:10px;
}

.right-menu button{
    width:50px;
    height:50px;

    border:none;

    border-radius:50%;

    color:white;

    background:rgba(15,20,35,.55);
}

/* CHARACTER */

.character{
    position:absolute;

    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    width:220px;
    height:320px;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;

    font-size:28px;

    text-shadow:0 0 20px cyan;
}

/* MODE */

.mode-box{
    position:absolute;

    right:20px;

    bottom:115px;

    width:180px;

    padding:10px;

    border-radius:18px;
}

.mode-box select{
    width:100%;

    background:none;

    border:none;

    color:white;

    font-size:18px;

    outline:none;
}

/* START */

.start-btn{
    position:absolute;

    right:20px;

    bottom:25px;

    width:190px;

    height:70px;

    border:none;

    border-radius:20px;

    font-size:28px;

    font-weight:bold;

    background:linear-gradient(
        90deg,
        #ffbf00,
        #ffeb3b
    );

    color:black;

    box-shadow:
        0 0 30px orange;
}

/* BOTTOM */

.bottom{
    position:absolute;

    left:15px;

    bottom:15px;

    width:250px;

    height:70px;

    border-radius:25px;

    display:flex;

    justify-content:space-around;

    align-items:center;
}

.bottom button{
    background:none;

    border:none;

    color:white;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:4px;
}

.bottom img{
    width:30px;
    height:30px;
}

/* MOBILE */

@media(max-width:700px){

    .player{
        transform:scale(.9);
        transform-origin:left top;
    }

    .currency{
        transform:scale(.9);
        transform-origin:right top;
    }

    .character{
        width:180px;
        height:260px;
        font-size:24px;
    }

    .left-menu button{
        width:100px;
    }

}

</style>
</head>

<body>

<img src="./images/bg.png" class="bg">

<!-- PLAYER -->

<div class="player glass">

    <div class="avatar">
        <i data-lucide="user"></i>
    </div>

    <div>
        <small>COMMANDER</small>

        <h3>PlayerOne</h3>

        <div class="xp">
            <div class="fill"></div>
        </div>
    </div>

</div>

<!-- CURRENCY -->

<div class="currency glass">

    <div>
        <img src="./images/coin.png">
        1200
    </div>

    <div>
        <img src="./images/gem.png">
        45
    </div>

    <div>
        <img src="./images/token.png">
        10
    </div>

</div>

<!-- LEFT -->

<div class="left-menu">

    <button>STORE</button>

    <button>MISSIONS</button>

    <button>EVENTS</button>

</div>

<!-- RIGHT -->

<div class="right-menu">

    <button>
        <i data-lucide="users"></i>
    </button>

    <button>
        <i data-lucide="mail"></i>
    </button>

    <button>
        <i data-lucide="trophy"></i>
    </button>

</div>

<!-- CHARACTER -->

<div class="character">
    SYRIX<br>SOLDIER
</div>

<!-- MODE -->

<div class="mode-box glass">

<select>

<option>1v1</option>

<option>Team</option>

<option>LV Mode</option>

<option>Team Death Match</option>

<option>CS Ranked</option>

</select>

</div>

<!-- START -->

<button class="start-btn">
    START ▶
</button>

<!-- BOTTOM -->

<div class="bottom glass">

    <button>
        <img src="./images/weapons.png">
        <small>WEAPONS</small>
    </button>

    <button>
        <img src="./images/characters.png">
        <small>CHARACTERS</small>
    </button>

    <button>
        <i data-lucide="settings"></i>
        <small>SETTINGS</small>
    </button>

</div>

<script>

lucide.createIcons();

if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js");
}

</script>

</body>
</html>
